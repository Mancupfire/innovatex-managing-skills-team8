<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>InnovateX | A Management Turnaround Plan · Team 8</title>
  <meta name="description" content="InnovateX | A Management Turnaround Plan. Team 8 · Managing Skills · VinUniversity.">
  <link rel="preload" href="assets/fonts/Inter-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/Inter-ExtraBold.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231d4ed8'/%3E%3Ctext x='16' y='22' font-family='Arial' font-size='15' font-weight='700' fill='white' text-anchor='middle'%3EIX%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/css/deck.css">
</head>
<body>
  <a class="skip-link" href="#deck">Skip to slides</a>

  <div class="app">
    <main id="deck" class="viewport" aria-label="Presentation slides" tabindex="-1">
      <div class="stage" id="stage">
        <noscript><p class="noscript">This presentation needs JavaScript. The PDF version is in <a href="InnovateX-Team8-Managing-Skills.pdf">InnovateX-Team8-Managing-Skills.pdf</a>.</p></noscript>
      </div>
    </main>

    <aside class="notes-panel" id="notes-panel" aria-label="Speaker notes" hidden>
      <div class="notes-head">
        <strong>Speaker notes</strong>
        <span class="notes-meta" id="notes-meta"></span>
      </div>
      <div class="notes-body" id="notes-body"></div>
    </aside>

    <nav class="toolbar" id="toolbar" aria-label="Presentation controls">
      <div class="tb-group">
        <button type="button" class="tb-btn" id="btn-toc" aria-label="Contents" aria-controls="toc" aria-expanded="false" title="Contents (T)"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 6h16M4 12h16M4 18h16"/></svg><span class="tb-label">Contents</span></button>
        <button type="button" class="tb-btn" id="btn-notes" aria-label="Speaker notes" aria-controls="notes-panel" aria-pressed="false" title="Speaker notes (N)"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 4h14v16H5z"/><path d="M8 9h8M8 13h8M8 17h5"/></svg><span class="tb-label">Notes</span></button>
      </div>
      <div class="tb-group tb-nav">
        <button type="button" class="tb-btn" id="btn-prev" title="Previous slide (←)" aria-label="Previous slide"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M15 5l-7 7 7 7"/></svg><span class="tb-label">Previous</span></button>
        <span class="counter" id="counter" aria-hidden="true">01 / 12</span>
        <button type="button" class="tb-btn" id="btn-next" title="Next slide (→)" aria-label="Next slide"><span class="tb-label">Next</span><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 5l7 7-7 7"/></svg></button>
      </div>
      <div class="tb-group">
        <span class="draft-badge" id="draft-badge" hidden title="Some slides are still awaiting team content">Draft</span>
        <button type="button" class="tb-btn" id="btn-print" aria-label="Print / Save as PDF" title="Print / Save as PDF (P)"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M7 8V3h10v5"/><path d="M5 17H3V9h18v8h-2"/><path d="M7 14h10v7H7z"/></svg><span class="tb-label">Print / Save as PDF</span></button>
        <a class="tb-btn" id="btn-pdf" aria-label="Download PDF" href="InnovateX-Team8-Managing-Skills.pdf" download><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M4 20h16"/></svg><span class="tb-label">Download PDF</span></a>
        <button type="button" class="tb-btn" id="btn-fs" aria-label="Full screen" title="Full screen (F)" aria-pressed="false"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg><span class="tb-label">Full screen</span></button>
      </div>
    </nav>
  </div>

  <div class="toc-backdrop" id="toc-backdrop" hidden></div>
  <aside class="toc" id="toc" aria-label="Contents" hidden>
    <div class="toc-head">
      <h2>Contents</h2>
      <button type="button" class="tb-btn" id="btn-toc-close" aria-label="Close contents"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <ol class="toc-list" id="toc-list"></ol>
    <p class="toc-help">Keys: ← → next/previous · Home/End first/last · F full screen · N notes · T contents · Esc returns arrow keys to the slides after using a button on a slide</p>
  </aside>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <div class="sr-only" id="announcer" aria-live="polite"></div>

  <!-- Load order: registry → deck settings (lists the slide files) → renderer -->
  <script src="assets/js/registry.js"></script>
  <script src="content/deck.js"></script>
  <script src="assets/js/deck.js"></script>
</body>
</html>
